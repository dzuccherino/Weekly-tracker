<!-- React only — no Babel, no build step, no compilation -->
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;
  --border:rgba(255,255,255,0.08);--border-md:rgba(255,255,255,0.14);
  --text:#f0ede4;--text-muted:#888880;--text-dim:#555550;
  --gold:#c8b87a;--gold-dim:rgba(200,184,122,0.15);--gold-border:rgba(200,184,122,0.3);
  --radius:12px;--radius-sm:8px;
  --font:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body,#root{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
#root{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top)}
button,textarea,input{font-family:var(--font);-webkit-tap-highlight-color:transparent}
textarea:focus,input:focus{outline:none}
::-webkit-scrollbar{display:none}
*{-ms-overflow-style:none;scrollbar-width:none}
</style>

<body>
<div id="root"></div>
<script>
const {useState,useEffect} = React;
function h(t,p){
  var args=[t,p];
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];
    if(Array.isArray(c)){for(var j=0;j<c.length;j++){if(c[j]!==null&&c[j]!==undefined&&c[j]!==false)args.push(c[j]);}}
    else if(c!==null&&c!==undefined&&c!==false){args.push(c);}
  }
  return React.createElement.apply(React,args);
}
var GOALS=[
  {id:"morning_med",label:"Morning Meditation",icon:"\u2600"},
  {id:"writing",    label:"Writing",            icon:"\u270d"},
  {id:"reading",    label:"Reading",            icon:"\u25ab"},
  {id:"evening_med",label:"Evening Meditation", icon:"\u25d1"},
];
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var COLORS=["#E24B4A","#EF9F27","#1D9E75","#378ADD","#7F77DD"];
var LABELS=["Minimal","Partial","Solid","Strong","Complete"];

function sc(v){return v?COLORS[v-1]:null;}
function ld(k){try{var s=localStorage.getItem(k);return s?JSON.parse(s):null;}catch(e){return null;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function getWeekStart(d){var x=new Date(d);x.setDate(x.getDate()-x.getDay());x.setHours(0,0,0,0);return x;}
function tds(d){return d.toISOString().split("T")[0];}
function wDates(ws){return Array.from({length:7},function(_,i){var d=new Date(ws);d.setDate(d.getDate()+i);return d;});}
function fmtW(ws){var we=new Date(ws);we.setDate(we.getDate()+6);var o={month:"short",day:"numeric"};return ws.toLocaleDateString("en-US",o)+" \u2013 "+we.toLocaleDateString("en-US",Object.assign({},o,{year:"numeric"}));}

function APISetup(props){
  var _=useState(""),key=_[0],setKey=_[1];
  var bStyle={flex:1,padding:"11px",borderRadius:"var(--radius-sm)",border:"1px solid var(--border-md)",background:"transparent",color:"var(--text-muted)",fontSize:13,cursor:"pointer"};
  return h("div",{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"2rem 1.5rem",gap:"1.5rem"}},
    h("div",{style:{width:56,height:56,borderRadius:"50%",background:sc(5)+"22",border:"1.5px solid "+sc(5)+"44",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}},"\u25ce"),
    h("div",{style:{textAlign:"center"}},
      h("h2",{style:{fontSize:20,fontWeight:600,marginBottom:8}},"Weekly Tracker"),
      h("p",{style:{fontSize:13,color:"var(--text-muted)",lineHeight:1.6,maxWidth:280}},"Enter your Anthropic API key to enable AI weekly integrations. Stored only on this device.")
    ),
    h("div",{style:{width:"100%",maxWidth:320}},
      h("input",{type:"password",value:key,onChange:function(e){setKey(e.target.value);},placeholder:"sk-ant-...",style:{width:"100%",padding:"12px 14px",borderRadius:"var(--radius-sm)",border:"1px solid var(--border-md)",background:"var(--surface)",color:"var(--text)",fontSize:14}}),
      h("p",{style:{fontSize:11,color:"var(--text-dim)",marginTop:6,lineHeight:1.5}},"Get your key at console.anthropic.com. The tracker works without it.")
    ),
    h("div",{style:{display:"flex",gap:10,width:"100%",maxWidth:320}},
      h("button",{onClick:function(){props.onSave("");},style:bStyle},"Skip for now"),
      h("button",{onClick:function(){if(key.trim())props.onSave(key.trim());},disabled:!key.trim(),style:{flex:1,padding:"11px",borderRadius:"var(--radius-sm)",border:"none",background:"var(--gold)",color:"#1a1600",fontSize:13,fontWeight:600,cursor:key.trim()?"pointer":"not-allowed",opacity:key.trim()?1:0.5}},"Save & Continue")
    )
  );
}

function ScoreDot(props){
  var val=props.val,current=props.current,onClick=props.onClick;
  var active=val<=current,isTip=val===current;
  return h("button",{onClick:onClick,style:{
    width:30,height:30,borderRadius:"50%",
    border:"1.5px solid "+(isTip?sc(current):active?sc(current)+"55":"rgba(255,255,255,0.12)"),
    background:isTip?sc(current):active?sc(current)+"28":"transparent",
    color:isTip?"#fff":active?sc(current):"rgba(255,255,255,0.25)",
    fontSize:11,fontWeight:600,cursor:"pointer",flexShrink:0,
    display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.12s"
  }},String(val));
}

function App(){
  var today=new Date(),todayStr=tds(today);
  var _a=useState(null),apiKey=_a[0],setApiKey=_a[1];
  var _b=useState(getWeekStart(today)),wkStart=_b[0],setWkStart=_b[1];
  var _c=useState(today.getDay()),selDay=_c[0],setSelDay=_c[1];
  var _d=useState({}),scores=_d[0],setScores=_d[1];
  var _e=useState({}),journals=_e[0],setJournals=_e[1];
  var _f=useState({}),threeGT=_f[0],setThreeGT=_f[1];
  var _g=useState({}),integrations=_g[0],setIntegrations=_g[1];
  var _h=useState("tracker"),tab=_h[0],setTab=_h[1];
  var _i=useState(false),generating=_i[0],setGenerating=_i[1];
  var _j=useState(""),genError=_j[0],setGenError=_j[1];
  var _k=useState(false),showApiEdit=_k[0],setShowApiEdit=_k[1];

  useEffect(function(){
    var k=ld("wt_apikey");
    setApiKey(k!==null?k:"");
    setScores(ld("wt_scores")||{});
    setJournals(ld("wt_journals")||{});
    setThreeGT(ld("wt_tgt")||{});
    setIntegrations(ld("wt_integrations")||{});
  },[]);

  function saveKey(k){setApiKey(k);sv("wt_apikey",k);setShowApiEdit(false);}
  function setScore(ds,gid,val){setScores(function(prev){var k=ds+"_"+gid,n=Object.assign({},prev);n[k]=prev[k]===val?0:val;sv("wt_scores",n);return n;});}
  function setJrnl(ds,txt){setJournals(function(prev){var n=Object.assign({},prev);n[ds]=txt;sv("wt_journals",n);return n;});}
  function setThing(ds,idx,txt){setThreeGT(function(prev){var day=(prev[ds]||["","",""]).slice();day[idx]=txt;var n=Object.assign({},prev);n[ds]=day;sv("wt_tgt",n);return n;});}

  function getScore(ds,gid){return scores[ds+"_"+gid]||0;}
  function getDaySum(ds){return GOALS.reduce(function(t,g){return t+getScore(ds,g.id);},0);}
  function getDayAvg(ds){var s=getDaySum(ds);return s>0?Math.round(s/4):0;}
  function getJrnl(ds){return journals[ds]||"";}
  function getThings(ds){return threeGT[ds]||["","",""];}
  function hasThings(ds){return (threeGT[ds]||[]).some(function(t){return t.trim().length>0;});}

  var dates=wDates(wkStart);
  var weekKey=tds(wkStart);
  var wMax=7*4*5;
  var wTotal=dates.reduce(function(t,d){return t+getDaySum(tds(d));},0);
  var wPct=Math.round((wTotal/wMax)*100);
  var isCurWk=weekKey===tds(getWeekStart(today));
  var selDate=dates[selDay];
  var selDs=tds(selDate);
  var isToday=selDs===todayStr;
  var barClr=wPct>=80?"#7F77DD":wPct>=60?"#378ADD":wPct>=40?"#1D9E75":"#EF9F27";

  function navWeek(dir){var d=new Date(wkStart);d.setDate(d.getDate()+dir*7);setWkStart(d);setSelDay(0);if(tab==="weekly")setTab("tracker");}

  function generate(){
    if(!apiKey){setShowApiEdit(true);return;}
    setGenerating(true);setGenError("");
    var entries=dates.map(function(date,i){
      var ds=tds(date);
      var gs=GOALS.map(function(g){var s=getScore(ds,g.id);return s>0?g.label+": "+s+"/5 ("+LABELS[s-1]+")":null;}).filter(Boolean);
      var tgt=getThings(ds).filter(function(t){return t.trim();});
      var tgtStr=tgt.length?tgt.map(function(t,j){return "  "+(j+1)+". "+t;}).join("\n"):"  (none recorded)";
      return DAYS[i]+" "+date.toLocaleDateString("en-US",{month:"short",day:"numeric"})+"\nGoals: "+(gs.length?gs.join(", "):"nothing logged")+"\nScore: "+getDaySum(ds)+"/20\nThree Good Things:\n"+tgtStr+"\nJournal: "+(getJrnl(ds)||"(no entry)");
    }).join("\n\n");

    var prompt="You are helping Dylan \u2014 an MBA student at UT Austin, Marine Corps veteran, marathon runner (30 marathons, 17 countries), and co-founder \u2014 with his weekly accountability review.\n\nWeek of "+fmtW(wkStart)+" | Weekly score: "+wTotal+"/"+wMax+" ("+wPct+"%)\n\n"+entries+"\n\nWrite a weekly integration in four sections using exactly these markdown headers:\n\n## This Week in Review\n2\u20133 honest sentences on the overall arc and texture of the week. Don't sugarcoat, don't catastrophize.\n\n## What Moved the Needle\nSpecific wins and moments of genuine engagement. Draw on the Three Good Things entries and journal where you can. Be concrete.\n\n## Patterns & Honest Observations\nWhat do the scores, Three Good Things, and journal words reveal together? Be direct about friction, inconsistency, or breakthroughs. Look for themes across the Three Good Things entries.\n\n## Going Into Next Week\n2\u20133 grounded intentions based on what this week revealed. Not a wish list \u2014 actual carry-forwards.\n\nWrite in second person. No filler. Tone: trusted advisor who read everything carefully. Dylan values directness over encouragement.";

    fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})
    }).then(function(r){return r.json();}).then(function(data){
      if(data.error)throw new Error(data.error.message);
      var text=(data.content||[]).map(function(b){return b.text||"";}).join("");
      setIntegrations(function(prev){var n=Object.assign({},prev);n[weekKey]=text;sv("wt_integrations",n);return n;});
      setTab("weekly");
    }).catch(function(err){
      setGenError(err.message||"Something went wrong. Check your API key.");
    }).finally(function(){setGenerating(false);});
  }

  function renderMd(text){
    if(!text)return null;
    return text.split("\n").map(function(line,i){
      if(line.indexOf("## ")===0)return h("div",{key:i,style:{marginTop:i===0?0:"1.5rem",marginBottom:"0.5rem",paddingBottom:"0.4rem",borderBottom:"1px solid var(--border)",fontSize:13,fontWeight:600,color:"var(--gold)",letterSpacing:"0.5px",textTransform:"uppercase"}},line.replace(/^## /,""));
      if(!line.trim())return null;
      return h("p",{key:i,style:{fontSize:14,lineHeight:1.75,color:"var(--text)",marginBottom:"0.5rem"}},line);
    });
  }

  if(apiKey===null)return h("div",{style:{flex:1,display:"flex",flexDirection:"column"}},h(APISetup,{onSave:saveKey}));
  if(showApiEdit)return h("div",{style:{flex:1,display:"flex",flexDirection:"column"}},h(APISetup,{onSave:saveKey}));

  // TOP BAR
  var topBar=h("div",{style:{padding:"14px 16px 10px",borderBottom:"1px solid var(--border)",background:"var(--bg)",flexShrink:0}},
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}},
      h("div",{style:{fontSize:16,fontWeight:700,letterSpacing:"-0.3px"}},"Weekly Tracker"),
      h("div",{style:{display:"flex",alignItems:"center",gap:6}},
        h("button",{onClick:function(){navWeek(-1);},style:{width:32,height:32,borderRadius:8,border:"1px solid var(--border-md)",background:"var(--surface)",color:"var(--text)",fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}},"\u2039"),
        h("span",{style:{fontSize:11,color:"var(--text-muted)",minWidth:140,textAlign:"center"}},fmtW(wkStart)),
        h("button",{onClick:function(){navWeek(1);},style:{width:32,height:32,borderRadius:8,border:"1px solid var(--border-md)",background:"var(--surface)",color:"var(--text)",fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}},"\u203a")
      ),
      !isCurWk&&h("button",{onClick:function(){setWkStart(getWeekStart(today));setSelDay(today.getDay());},style:{fontSize:11,padding:"4px 8px",borderRadius:6,border:"1px solid var(--gold-border)",background:"var(--gold-dim)",color:"var(--gold)",cursor:"pointer"}},"Today")
    ),
    h("div",{style:{display:"flex",alignItems:"center",gap:10}},
      h("div",{style:{flex:1,height:4,background:"var(--surface2)",borderRadius:2,overflow:"hidden"}},
        h("div",{style:{height:"100%",width:wPct+"%",background:barClr,borderRadius:2,transition:"width 0.4s ease"}})
      ),
      h("span",{style:{fontSize:12,fontWeight:600,color:barClr,minWidth:36,textAlign:"right"}},wPct+"%"),
      h("span",{style:{fontSize:11,color:"var(--text-dim)"}},wTotal+"/"+wMax)
    ),
    h("div",{style:{display:"flex",gap:4,marginTop:10,justifyContent:"space-between"}},
      dates.map(function(date,i){
        var ds=tds(date),avg=getDayAvg(ds),hasJ=!!getJrnl(ds)||hasThings(ds);
        return h("button",{key:i,onClick:function(){setSelDay(i);},style:{flex:1,padding:"5px 2px",borderRadius:7,textAlign:"center",cursor:"pointer",border:selDay===i?"1px solid var(--gold)":"1px solid transparent",background:selDay===i?"var(--gold-dim)":"transparent"}},
          h("div",{style:{fontSize:9,fontWeight:500,color:selDay===i?"var(--gold)":"var(--text-dim)",marginBottom:2}},DAYS[i]),
          h("div",{style:{width:8,height:8,borderRadius:"50%",margin:"0 auto",background:avg>0?sc(avg):"var(--border)"}}),
          hasJ&&h("div",{style:{width:3,height:3,borderRadius:"50%",background:"var(--text-dim)",margin:"2px auto 0"}})
        );
      })
    )
  );

  // TAB BAR
  var tabBar=h("div",{style:{display:"flex",borderBottom:"1px solid var(--border)",background:"var(--bg)",flexShrink:0}},
    ["tracker","journal","weekly"].map(function(t){
      return h("button",{key:t,onClick:function(){setTab(t);},style:{flex:1,padding:"11px 4px",fontSize:12,fontWeight:tab===t?600:400,color:tab===t?"var(--gold)":"var(--text-muted)",background:"none",border:"none",cursor:"pointer",borderBottom:tab===t?"2px solid var(--gold)":"2px solid transparent",letterSpacing:"0.2px"}},
        t==="tracker"?"Tracker":t==="journal"?"Journal":"Weekly Review"
      );
    })
  );

  // DAY STRIP
  var dayStrip=h("div",{style:{display:"flex",gap:5,padding:"10px 14px 8px",overflowX:"auto",background:"var(--bg)",flexShrink:0}},
    dates.map(function(date,i){
      var ds=tds(date),avg=getDayAvg(ds),isSel=selDay===i,isTod=tds(date)===todayStr;
      return h("button",{key:i,onClick:function(){setSelDay(i);},style:{flexShrink:0,minWidth:50,padding:"7px 4px",borderRadius:"var(--radius-sm)",border:isSel?"1.5px solid var(--gold)":isTod?"1px solid var(--border-md)":"1px solid var(--border)",background:isSel?"var(--gold-dim)":isTod?"var(--surface2)":"var(--surface)",cursor:"pointer",textAlign:"center"}},
        h("div",{style:{fontSize:10,fontWeight:500,color:isSel?"var(--gold)":"var(--text-muted)",letterSpacing:"0.3px"}},DAYS[i]),
        h("div",{style:{fontSize:17,fontWeight:600,color:isSel?"var(--gold)":"var(--text)",lineHeight:1.3}},String(date.getDate())),
        h("div",{style:{display:"flex",justifyContent:"center",gap:3,marginTop:3,height:6}},
          avg>0&&h("div",{style:{width:5,height:5,borderRadius:"50%",background:sc(avg)}}),
          (!!getJrnl(ds)||hasThings(ds))&&h("div",{style:{width:5,height:5,borderRadius:"50%",background:"var(--text-dim)"}})
        )
      );
    })
  );

  // TRACKER TAB
  var trackerTab=h("div",{style:{padding:"12px 14px"}},
    h("div",{style:{background:"var(--surface)",borderRadius:"var(--radius)",border:"1px solid "+(isToday?"var(--gold-border)":"var(--border)"),overflow:"hidden"}},
      h("div",{style:{padding:"12px 14px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--surface2)"}},
        h("span",{style:{fontSize:13,fontWeight:600}},
          selDate.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"}),
          isToday&&h("span",{style:{fontSize:10,fontWeight:500,color:"var(--gold)",marginLeft:8,padding:"2px 6px",background:"var(--gold-dim)",borderRadius:4}},"TODAY")
        ),
        h("span",{style:{fontSize:12,color:"var(--text-muted)"}},getDaySum(selDs)+"/20")
      ),
      GOALS.map(function(goal,gi){
        var cur=getScore(selDs,goal.id);
        return h("div",{key:goal.id,style:{padding:"14px",borderBottom:gi<GOALS.length-1?"1px solid var(--border)":"none",background:cur>0?sc(cur)+"0a":"transparent"}},
          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
            h("span",{style:{fontSize:14,display:"flex",alignItems:"center",gap:8}},h("span",{style:{fontSize:16}},goal.icon),goal.label),
            cur>0&&h("span",{style:{fontSize:11,fontWeight:600,color:sc(cur),padding:"2px 8px",background:sc(cur)+"22",borderRadius:20}},LABELS[cur-1])
          ),
          h("div",{style:{display:"flex",gap:8,marginTop:10}},

      LABELS.map(function(l,i){return h("div",{key:i,style:{display:"flex",alignItems:"center",gap:5,fontSize:11,color:"var(--text-muted)"}},h("div",{style:{width:8,height:8,borderRadius:"50%",background:sc(i+1)}}),(i+1)+" \u2014 "+l);})
    )
  );

  // JOURNAL TAB

    h("div",{style:{background:"var(--surface)",borderRadius:"var(--radius)",border:"1px solid var(--border)",overflow:"hidden"}},
      h("div",{style:{padding:"11px 14px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--surface2)"}},
        h("div",{style:{display:"flex",alignItems:"center",gap:8}},h("span",{style:{fontSize:15}},"\u2726"),h("span",{style:{fontSize:13,fontWeight:600}},"Three Good Things")),
        h("span",{style:{fontSize:11,color:"var(--text-dim)"}},things.filter(function(t){return t.trim();}).length+"/3")
      ),
      h("div",{style:{padding:"12px 14px",display:"flex",flexDirection:"column",gap:8}},
        h("p",{style:{fontSize:11,color:"var(--text-dim)",lineHeight:1.5,marginBottom:2}},"Name three things that went well today \u2014 small or large. Be specific."),
        [0,1,2].map(function(idx){
          var val=things[idx]||"",filled=val.trim().length>0;
          return h("div",{key:idx,style:{display:"flex",alignItems:"flex-start",gap:10}},
            h("div",{style:{width:24,height:24,borderRadius:"50%",flexShrink:0,marginTop:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,background:filled?"var(--gold-dim)":"var(--surface2)",border:filled?"1px solid var(--gold-border)":"1px solid var(--border-md)",color:filled?"var(--gold)":"var(--text-dim)",transition:"all 0.15s"}},String(idx+1)),
            h("textarea",{value:val,onChange:function(e){setThing(selDs,idx,e.target.value);},placeholder:["Something that went well\u2026","A moment worth noting\u2026","Something you're grateful for\u2026"][idx],rows:2,style:{flex:1,background:"var(--surface2)",color:"var(--text)",border:"1px solid "+(filled?"var(--gold-border)":"var(--border)"),borderRadius:8,padding:"8px 12px",fontSize:13,lineHeight:1.6,resize:"none",fontFamily:"var(--font)"}})
          );
        })
      ),
      hasThings(selDs)&&h("div",{style:{padding:"8px 14px",borderTop:"1px solid var(--border)",background:"var(--surface2)"}},h("span",{style:{fontSize:11,color:"#1D9E75"}},"\u2713 saved"))
    ),
    h("div",{style:{background:"var(--surface)",borderRadius:"var(--radius)",border:"1px solid "+(isToday?"var(--gold-border)":"var(--border)"),overflow:"hidden"}},
      h("div",{style:{padding:"11px 14px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--surface2)"}},
        h("div",{style:{display:"flex",alignItems:"center",gap:8}},
          h("span",{style:{fontSize:15}},"\u270d"),
          h("span",{style:{fontSize:13,fontWeight:600}},
            "Daily Journal",
            isToday&&h("span",{style:{fontSize:10,fontWeight:500,color:"var(--gold)",marginLeft:8,padding:"2px 6px",background:"var(--gold-dim)",borderRadius:4}},"TODAY")
          )
        ),
        h("div",{style:{display:"flex",gap:5}},
          GOALS.map(function(g){var s=getScore(selDs,g.id);return s>0?h("span",{key:g.id,style:{fontSize:10,padding:"2px 5px",borderRadius:4,background:sc(s)+"22",color:sc(s),fontWeight:600}},String(s)):null;})
        )
      ),
      h("div",{style:{padding:"14px"}},
        h("p",{style:{fontSize:11,color:"var(--text-dim)",marginBottom:10,lineHeight:1.5}},"Reflect freely \u2014 wins, friction, insights. This feeds your weekly integration."),
        h("textarea",{value:getJrnl(selDs),onChange:function(e){setJrnl(selDs,e.target.value);},placeholder:"Write anything \u2014 a moment that stood out, what your meditation surfaced, a line from your reading, what you're noticing...",style:{width:"100%",minHeight:180,background:"var(--surface2)",color:"var(--text)",border:"1px solid var(--border)",borderRadius:8,padding:"12px 14px",fontSize:14,lineHeight:1.75,resize:"vertical",fontFamily:"var(--font)"}}),
        h("div",{style:{display:"flex",justifyContent:"space-between",marginTop:8}},
          h("span",{style:{fontSize:11,color:"var(--text-dim)"}},(getJrnl(selDs).trim().split(/\s+/).filter(Boolean).length||0)+" words"),
          getJrnl(selDs)&&h("span",{style:{fontSize:11,color:"#1D9E75"}},"\u2713 saved")
        )
      ),
      h("div",{style:{borderTop:"1px solid var(--border)",padding:"10px 14px",background:"var(--surface2)"}},
        h("div",{style:{fontSize:10,color:"var(--text-dim)",marginBottom:8,fontWeight:500,letterSpacing:"0.5px",textTransform:"uppercase"}},"This week"),
        h("div",{style:{display:"flex",gap:5,flexWrap:"wrap"}},
          dates.map(function(d,i){
            var ds=tds(d),j=getJrnl(ds),tgt=hasThings(ds),isCur=i===selDay;
            return h("button",{key:i,onClick:function(){setSelDay(i);},style:{fontSize:11,padding:"4px 10px",borderRadius:6,cursor:"pointer",border:isCur?"1px solid var(--gold)":"1px solid var(--border-md)",background:isCur?"var(--gold-dim)":"transparent",color:isCur?"var(--gold)":(j||tgt)?"var(--text-muted)":"var(--text-dim)"}},
              DAYS[i]+(tgt?" \u2726":"")+(j?" \u2713":"")
            );
          })
        )
      )
    )
  );

  // WEEKLY TAB
  var weeklyTab=h("div",{style:{padding:"12px 14px"}},
    integrations[weekKey]
      ? h(React.Fragment,null,
          h("div",{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"18px 16px",marginBottom:12}},renderMd(integrations[weekKey])),
          h("div",{style:{display:"flex",gap:8}},
            h("button",{onClick:generate,disabled:generating,style:{flex:1,padding:"12px",borderRadius:"var(--radius-sm)",border:"1px solid var(--border-md)",background:"var(--surface)",color:"var(--text-muted)",fontSize:13,cursor:generating?"not-allowed":"pointer",opacity:generating?0.5:1}},generating?"\u21bb  Regenerating\u2026":"\u21ba  Regenerate"),
            h("button",{onClick:function(){setShowApiEdit(true);},style:{padding:"12px 14px",borderRadius:"var(--radius-sm)",border:"1px solid var(--border)",background:"transparent",color:"var(--text-dim)",fontSize:12,cursor:"pointer"}},"API Key")
          ),
          genError&&h("p",{style:{fontSize:12,color:"#E24B4A",marginTop:10,lineHeight:1.5}},genError)
        )
      : h("div",{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"28px 20px",textAlign:"center"}},
          h("div",{style:{fontSize:32,marginBottom:12}},"\u25ce"),
          h("div",{style:{fontSize:15,fontWeight:600,marginBottom:8}},"Weekly Integration"),
          h("p",{style:{fontSize:13,color:"var(--text-muted)",lineHeight:1.65,margin:"0 auto 20px",maxWidth:280}},"Claude reads all seven days of scores, Three Good Things, and journal entries and writes a structured reflection for your Sunday call."),
          h("div",{style:{display:"flex",gap:5,justifyContent:"center",marginBottom:20}},
            dates.map(function(d,i){
              var ds=tds(d),avg=getDayAvg(ds),hasJ=!!getJrnl(ds),hasTgt=hasThings(ds);
              return h("div",{key:i,style:{display:"flex",flexDirection:"column",alignItems:"center",gap:3,minWidth:36,padding:"6px 4px",borderRadius:7,background:"var(--surface2)",border:"1px solid var(--border)"}},
                h("div",{style:{fontSize:9,color:"var(--text-dim)",fontWeight:500}},DAYS[i]),
                h("div",{style:{width:10,height:10,borderRadius:"50%",background:avg>0?sc(avg):"var(--border)"}}),
                h("div",{style:{display:"flex",gap:2}},
                  hasTgt&&h("div",{style:{width:4,height:4,borderRadius:"50%",background:"var(--gold)"}}),
                  hasJ&&h("div",{style:{width:4,height:4,borderRadius:"50%",background:"var(--text-dim)"}})
                )
              );
            })
          ),
          h("button",{onClick:generate,disabled:generating,style:{padding:"13px 28px",borderRadius:"var(--radius-sm)",border:"none",background:generating?"var(--surface2)":"var(--gold)",color:generating?"var(--text-muted)":"#1a1600",fontSize:14,fontWeight:700,cursor:generating?"not-allowed":"pointer",width:"100%",maxWidth:280}},generating?"Generating\u2026":"Generate Weekly Integration"),
          !apiKey&&h("p",{style:{fontSize:11,color:"var(--text-dim)",marginTop:12}},"No API key set. ",h("button",{onClick:function(){setShowApiEdit(true);},style:{background:"none",border:"none",color:"var(--gold)",fontSize:11,cursor:"pointer",textDecoration:"underline"}},"Add one here.")),
          genError&&h("p",{style:{fontSize:12,color:"#E24B4A",marginTop:12,lineHeight:1.5}},genError)
        )
  );

  return h("div",{style:{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}},
    topBar,tabBar,
    (tab==="tracker"||tab==="journal")&&dayStrip,
    h("div",{style:{flex:1,overflowY:"auto",padding:"0 0 calc(1rem + var(--safe-bottom))"}},
      tab==="tracker"&&trackerTab,
      tab==="journal"&&journalTab,
      tab==="weekly" &&weeklyTab
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
